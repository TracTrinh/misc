<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pāḷi Chanting — Tuyển Tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #fdf6e8;
  --bg-inner: #fef9f0;
  --gold:     #8b6914;
  --gold-bd:  #d4a843;
  --sep:      #c9a96e;
  --shadow:   rgba(100,60,10,0.10);
  --ca:       #8b4f00;
  --crimson:  #7b1c1d;
  --fn-main:  'Noto Serif','Times New Roman',serif;
  --fn-ttl:   'Cinzel','Times New Roman',serif;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(212,168,67,.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(158,42,43,.05) 0%, transparent 50%);
  font-family: var(--fn-main);
  color: var(--ca);
  min-height: 100vh;
  padding: 2rem 1rem 4rem;
}
.page { max-width: 680px; margin: 0 auto; }

/* Header */
.header {
  text-align: center;
  padding: 2.8rem 2rem 2rem;
  margin-bottom: 2.4rem;
  border-bottom: 2px solid var(--gold-bd);
  position: relative;
}
.header::before {
  content: '❖';
  position: absolute;
  bottom: -.75rem; left: 50%;
  transform: translateX(-50%);
  font-size: 1.1rem;
  color: var(--gold-bd);
  background: var(--bg);
  padding: 0 .5rem;
}
.title-main {
  font-family: var(--fn-ttl);
  font-size: 1.9rem;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.title-sub {
  font-family: var(--fn-ttl);
  font-size: .85rem;
  font-weight: 400;
  color: #7a4f28;
  letter-spacing: .18em;
  margin-top: .5rem;
  text-transform: uppercase;
}

/* Section label */
.section-label {
  font-family: var(--fn-ttl);
  font-size: .68rem;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
  margin: 2.2rem 0 1rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.section-label::before,
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--sep));
}
.section-label::after {
  background: linear-gradient(to left, transparent, var(--sep));
}

/* Card */
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  background: var(--bg-inner);
  border: 1px solid var(--sep);
  border-radius: 10px;
  padding: .9rem 1.2rem;
  margin-bottom: .7rem;
  box-shadow: 2px 2px 8px var(--shadow);
  text-decoration: none;
  color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.card:hover {
  border-color: var(--gold-bd);
  box-shadow: 2px 3px 14px rgba(100,60,10,.16);
}
.card-text { flex: 1; }
.card-pali {
  font-family: var(--fn-main);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: .03em;
}
.card-viet {
  font-size: .8rem;
  color: #7a4f28;
  margin-top: .18rem;
  font-style: italic;
}
.card-arrow {
  font-size: 1rem;
  color: var(--sep);
  flex-shrink: 0;
}

/* Practice card */
.card.practice {
  border-color: #c8a0a0;
  background: linear-gradient(135deg, #fff9f9 0%, #fdf3f0 100%);
}
.card.practice .card-pali { color: var(--crimson); }
.card.practice:hover { border-color: var(--crimson); }

/* Footer */
.footer {
  text-align: center;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--sep);
  font-size: .75rem;
  color: #9a7040;
  line-height: 1.9;
  letter-spacing: .05em;
}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="title-main">Pāḷi Chanting</div>
    <div class="title-sub">Tuyển Tập Interlinear</div>
  </div>

  <div class="section-label">Kinh Tụng — Interlinear</div>

  <a class="card" href="ratana-sutta-interlinear.html">
    <div class="card-text">
      <div class="card-pali">Ratanasuttaṁ</div>
      <div class="card-viet">Kinh Châu Báu</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <a class="card" href="pbs.html">
    <div class="card-text">
      <div class="card-pali">Pubbaṇhasuttaṁ</div>
      <div class="card-viet">Kinh Ban Mai</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <a class="card" href="kunala_jataka.html">
    <div class="card-text">
      <div class="card-pali">Kuṇāla Jātaka</div>
      <div class="card-viet">Bổn Sanh số 536</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <div class="section-label">Luyện Tập — Practice</div>

  <a class="card practice" href="Ratanasuttam_cloze.html">
    <div class="card-text">
      <div class="card-pali">Ratanasuttaṁ — Điền Vào Chỗ Trống</div>
      <div class="card-viet">Cloze exercise · 20 kệ</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <div class="footer">
    tractrinh.github.io · Pāḷi Interlinear Collection
  </div>

</div>
</body>
</html>
